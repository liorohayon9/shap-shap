name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Assemble APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk remind-me.apk

      - uses: actions/upload-artifact@v4
        with:
          name: remind-me-apk
          path: remind-me.apk

      # A rolling release so the phone download link never changes.
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Remind Me — latest build
          body: |
            Tap **remind-me.apk** below to install on Android.

            Built from commit ${{ github.sha }}.
          files: remind-me.apk
          make_latest: true

  pages:
    name: Web app (PWA)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for GitHub Pages
        # Pages serves the site from /<repo>/, so assets need that prefix.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
