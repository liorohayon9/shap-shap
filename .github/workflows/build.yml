name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets into the Android project
        run: npx cap sync android

      # Without a stable key every build gets a fresh signature and Android
      # refuses to install it over the copy already on the phone.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is missing — the APK would be unsignable."
            exit 1
          fi
          # tr strips any stray CR/newlines a shell or editor may have folded in.
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > android/app/shapshap.p12
          keytool -list -keystore android/app/shapshap.p12 -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" | sed -n '1,12p'

      - name: Assemble APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shap-shap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shap-shap-apk
          path: shap-shap.apk

      # A rolling release so the phone download link never changes.
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shap Shap — latest build
          body: |
            Tap **shap-shap.apk** below to install on Android.

            Built from commit ${{ github.sha }}.
          files: shap-shap.apk
          make_latest: true

  pages:
    name: Web app (PWA)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for GitHub Pages
        # Pages serves the site from /<repo>/, so assets need that prefix.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
